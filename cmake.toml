[project]
name = "kernemul"
languages = ["CXX"]
cmake-after = """
# Guest architecture, fixed at build time: the Windows type layouts in
# kernel/win/types.hpp come from one ntoskrnl PDB and are memcpy'd into guest
# memory as-is, so two architectures cannot coexist in one binary.
#
# This stays raw CMake because cmkr [options] are boolean only, and [variables]
# emits an uncached set() that would clobber -DKERNEMUL_ARCH. It lives at
# project level so the value exists before the arch-* conditions below are
# evaluated.
set(KERNEMUL_ARCH "x64" CACHE STRING "guest architecture: x64 or arm64")
set_property(CACHE KERNEMUL_ARCH PROPERTY STRINGS x64 arm64)

if(NOT KERNEMUL_ARCH MATCHES "^(x64|arm64)$")
	message(FATAL_ERROR "KERNEMUL_ARCH must be x64 or arm64, got: ${KERNEMUL_ARCH}")
endif()

message(STATUS "kernemul guest architecture: ${KERNEMUL_ARCH}")

# Emulator backend, fixed at build time the same way. Unicorn interprets and
# builds anywhere; whp runs the guest on the host cpu in a Hyper-V partition,
# which needs the host to be the guest's own architecture.
set(KERNEMUL_BACKEND "unicorn" CACHE STRING "emulator backend: unicorn or whp")
set_property(CACHE KERNEMUL_BACKEND PROPERTY STRINGS unicorn whp)

if(NOT KERNEMUL_BACKEND MATCHES "^(unicorn|whp)$")
	message(FATAL_ERROR "KERNEMUL_BACKEND must be unicorn or whp, got: ${KERNEMUL_BACKEND}")
endif()

if(KERNEMUL_BACKEND STREQUAL "whp" AND NOT (WIN32 AND KERNEMUL_ARCH STREQUAL "x64"))
	message(FATAL_ERROR "KERNEMUL_BACKEND=whp needs Windows and KERNEMUL_ARCH=x64")
endif()

message(STATUS "kernemul backend: ${KERNEMUL_BACKEND}")

# Unicorn is declared here rather than in [fetch-content] because it needs a
# PATCH_COMMAND, which cmkr has no key for.
#
# Both patches are one hole: Unicorn calls the UC_HOOK_INTR callback in place of
# the target's do_interrupt, so whatever that function would have done to the
# cpu state never happens. AArch64 never latches the faulting address and
# syndrome into FAR_ELn / ESR_ELn, which is the only way arm64::arch::fault_addr
# can learn which address faulted -- no Unicorn API exposes it. x86 leaves the
# delivered exception pending, and the next fault combines with it into a double
# fault. Pinned to a commit rather than master so the patches keep applying.
set(unicorn_patches
	"${CMAKE_CURRENT_SOURCE_DIR}/patches/unicorn-arm64-fault-regs.patch"
	"${CMAKE_CURRENT_SOURCE_DIR}/patches/unicorn-x86-clear-old-exception.patch"
)

include(FetchContent)
message(STATUS "Fetching unicorn (patched)...")
FetchContent_Declare(unicorn
	GIT_REPOSITORY "https://github.com/unicorn-engine/unicorn"
	GIT_TAG 7c5db94191defc1e04a4f66f4eb1220903cba837
	PATCH_COMMAND "${CMAKE_COMMAND}"
		"-DSRC=<SOURCE_DIR>"
		"-DPATCHES=${unicorn_patches}"
		-P "${CMAKE_CURRENT_SOURCE_DIR}/cmake/apply_patch.cmake"
)
FetchContent_MakeAvailable(unicorn)

# Zydis is only needed by the WHP backend, which decodes the instruction behind
# a memory exit to work out which address it touched. Declared here rather than
# in [fetch-content] so the tools and examples can be turned off before it is
# made available.
if(KERNEMUL_BACKEND STREQUAL "whp")
	set(ZYDIS_BUILD_TOOLS OFF CACHE BOOL "" FORCE)
	set(ZYDIS_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)

	message(STATUS "Fetching zydis...")
	FetchContent_Declare(zydis
		GIT_REPOSITORY "https://github.com/zyantific/zydis"
		GIT_TAG v4.1.0
	)
	FetchContent_MakeAvailable(zydis)
endif()
"""

[conditions]
windows = "WIN32"
# Both of these are gcc's own spelling: clang rejects -Wno-changes-meaning as an
# unknown warning option, and msvc takes neither.
gnu = "CMAKE_CXX_COMPILER_ID STREQUAL \"GNU\""
msvc = "MSVC"
arch-x64 = "KERNEMUL_ARCH STREQUAL \"x64\""
arch-arm64 = "KERNEMUL_ARCH STREQUAL \"arm64\""
whp = "KERNEMUL_BACKEND STREQUAL \"whp\""

[fetch-content.spdlog]
git = "https://github.com/gabime/spdlog"
tag = "v1.x"

[fetch-content.raw_pdb]
git = "https://github.com/MolecularMatters/raw_pdb"
tag = "main"

[fetch-content.Boost]
url = "https://github.com/boostorg/boost/releases/download/boost-1.86.0/boost-1.86.0-cmake.tar.xz"

[find-package.OpenSSL]
required = true

[target.kernemul]
type = "executable"
sources = ["src/**.cpp", "src/**.hpp"]
include-directories = ["src", "vendor/pe/src", "vendor/ia32-doc/out"]
compile-features = ["cxx_std_23"]
link-libraries = ["spdlog::spdlog", "unicorn", "raw_pdb", "Boost::beast", "OpenSSL::SSL", "OpenSSL::Crypto"]
windows.link-libraries = ["ws2_32"]
# The generated Windows types put every struct under #pragma pack(1) and lean on
# ms_struct for the rest of the layout, so a bitfield keeps a whole allocation
# unit of its declared type. gcc ignores "#pragma ms_struct on" everywhere it is
# not the native convention and packs the bitfield down to the bits it uses
# instead, which leaves 78 of the generated structs short of the size pdbex
# recorded for them. -mms-bitfields is the flag behind that pragma. clang honours
# the pragma unaided and mingw already defaults to this, so gcc is the only one
# that has to be told.
gnu.compile-options = ["-Wno-changes-meaning", "-mms-bitfields"]
# The logging macros use __VA_OPT__, which only msvc's conformant preprocessor has.
msvc.compile-options = ["/Zc:preprocessor"]
arch-x64.compile-definitions = ["KERNEMUL_ARCH_X64=1"]
arch-arm64.compile-definitions = ["KERNEMUL_ARCH_ARM64=1"]
whp.sources = ["vendor/hypermulator/src/**.cpp", "vendor/hypermulator/src/**.hpp"]
whp.include-directories = ["vendor/hypermulator/src"]
whp.link-libraries = ["Zydis", "WinHvPlatform"]
whp.compile-definitions = ["KERNEMUL_HAS_WHP=1"]
