# cmake.toml - cmkr project description
# NOTE: This project uses a hand-written CMakeLists.txt because the backend
# switching logic (hypermulator vs unicorn, Windows vs Linux) requires
# conditions that cmkr cannot express. This file serves as documentation.
# Run: cmake -B build -DUSE_UNICORN_BACKEND=ON  (for unicorn/cross-platform)
#      cmake -B build                            (for hypermulator on Windows)

[cmake]
version = "3.21"

[project]
name = "kernemul"
version = "0.1.0"
languages = ["CXX"]
